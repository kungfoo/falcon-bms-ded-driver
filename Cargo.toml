[package]
name = "falcon-bms-ded-driver"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
vergen-git2 = { version = "1.0.0", features = ["build", "cargo", "rustc", "si"] }
anyhow = "*"

[dependencies]
log = "0.4"
env_logger = "0.11"
winapi = "*"
user32-sys = "*"
seahash = "4.1.0"
levenshtein = "1.0.5"
figment = { version = "0.10", features = ["toml"]}
serde = {version = "1", features = ["derive"]}
anyhow = "1.0"

bms-sm = { git = "https://github.com/kungfoo/bms-rs.git", version = "0.2" }
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
hidapi = { version = "2.6.7", features = ["windows-native"] }

[profile.release]
lto = true
strip = true
opt-level = 3  # Optimize for speed.
